on: [push, pull_request]

jobs:
  main:
    strategy:
      fail-fast: false
      matrix:
        job_name: ['linux', 'windows', 'macos']

        include:
        - job_name: linux
          os: ubuntu-latest
          shell: bash {0}

        - job_name: windows
          os: windows-latest
          shell: msys2 {0}

        - job_name: macos
          os: macos-latest
          shell: bash {0}

    defaults:
      run:
        shell: ${{ matrix.shell }}

    name: hactool-${{ matrix.job_name }}
    runs-on: ${{ matrix.os }}

    steps:
    - uses: msys2/setup-msys2@v2
      if: matrix.os == 'windows-latest'
      with:
        path-type: inherit
        msystem: MINGW64
        update: true
        install: mingw-w64-x86_64-gcc mingw-w64-x86_64-make mingw-w64-x86_64-capstone

    - name: Install capstone (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get install -y libcapstone-dev

    - name: Install capstone (macOS)
      if: matrix.os == 'macos-latest'
      env:
        HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
      run: brew install capstone

    - uses: actions/checkout@v7

    - run: mv config.mk.template config.mk

    - name: Static link capstone (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: sed -i 's/-lcapstone/-Wl,-Bstatic -lcapstone -Wl,-Bdynamic/' config.mk

    - name: Add capstone paths (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        echo "CFLAGS += -I$(brew --prefix capstone)/include" >> config.mk
        echo "LDFLAGS += -L$(brew --prefix capstone)/lib" >> config.mk

    - run: make -j$(nproc 2>/dev/null || sysctl -n hw.logicalcpu)

    - uses: actions/upload-artifact@v7
      with:
        name: hactool-${{ matrix.job_name }}
        path: hactool*
