on: [push, pull_request]

jobs:
  main:
    strategy:
      fail-fast: false
      matrix:
        job_name: ['linux', 'windows', 'macos-arm64', 'macos-intel']

        include:
          - job_name: linux
            os: ubuntu-latest
            shell: bash {0}
            platform: linux

          - job_name: windows
            os: windows-latest
            shell: msys2 {0}
            platform: windows

          - job_name: macos-arm64
            os: macos-latest
            shell: bash {0}
            platform: macos

          - job_name: macos-intel
            os: macos-15-intel
            shell: bash {0}
            platform: macos

    defaults:
      run:
        shell: ${{ matrix.shell }}

    name: hactool-${{ matrix.job_name }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Install build tools (Linux)
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y cmake

      - uses: msys2/setup-msys2@v2
        if: matrix.platform == 'windows'
        with:
          path-type: inherit
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-make mingw-w64-x86_64-cmake git

      - name: Install build tools (macOS)
        if: matrix.platform == 'macos'
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: brew install cmake

      - uses: actions/checkout@v7

      - name: Build static, AArch64-only capstone from source
        run: |
          git clone --depth 1 --branch 5.0.9 https://github.com/capstone-engine/capstone capstone-src
          cmake -S capstone-src -B capstone-src/build \
            -DCAPSTONE_BUILD_SHARED_LIBS=OFF \
            -DCAPSTONE_BUILD_CSTOOL=OFF \
            -DCAPSTONE_ARCHITECTURE_DEFAULT=OFF \
            -DCAPSTONE_ARM64_SUPPORT=ON \
            -DCMAKE_C_FLAGS="-ffunction-sections -fdata-sections" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build capstone-src/build -j$(nproc 2>/dev/null || sysctl -n hw.logicalcpu)

      - run: mv config.mk.template config.mk

      - name: Configure build (Linux)
        if: matrix.platform == 'linux'
        run: |
          {
            echo "CFLAGS += -I${{ github.workspace }}/capstone-src/include -ffunction-sections -fdata-sections"
            echo "LDFLAGS += -L${{ github.workspace }}/capstone-src/build -Wl,-Bstatic -lcapstone -Wl,-Bdynamic -s -Wl,--gc-sections"
          } >> config.mk

      - name: Configure build (macOS)
        if: matrix.platform == 'macos'
        run: |
          {
            echo "CFLAGS += -I${{ github.workspace }}/capstone-src/include -ffunction-sections -fdata-sections"
            echo "LDFLAGS += -L${{ github.workspace }}/capstone-src/build -lcapstone -Wl,-dead_strip -s"
          } >> config.mk

      - name: Configure build (Windows)
        if: matrix.platform == 'windows'
        run: |
          {
            echo "CFLAGS += -I${{ github.workspace }}/capstone-src/include -ffunction-sections -fdata-sections"
            echo "LDFLAGS += -L${{ github.workspace }}/capstone-src/build -lcapstone -static -s -Wl,--gc-sections"
          } >> config.mk

      - run: make -j$(nproc 2>/dev/null || sysctl -n hw.logicalcpu)

      - uses: actions/upload-artifact@v7
        with:
          name: hactool-${{ matrix.job_name }}
          path: hactool*