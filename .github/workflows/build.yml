on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  main:
    strategy:
      fail-fast: false
      matrix:
        job_name: ['linux', 'windows', 'macos']

        include:
        - job_name: linux
          os: ubuntu-latest
          shell: bash {0}

        - job_name: windows
          os: windows-latest
          shell: msys2 {0}

        - job_name: macos
          os: macos-15-intel
          shell: bash {0}

    defaults:
      run:
        shell: ${{ matrix.shell }}

    name: hactool-${{ matrix.job_name }}
    runs-on: ${{ matrix.os }}

    steps:
    - uses: msys2/setup-msys2@v2
      if: matrix.os == 'windows-latest'
      with:
        path-type: inherit
        msystem: MINGW64
        update: true
        install: mingw-w64-x86_64-gcc mingw-w64-x86_64-make mingw-w64-x86_64-capstone

    - name: Checkout capstone
      uses: actions/checkout@v7
      with:
        fetch-tags: true
        repository: capstone-engine/capstone
        path: capstone
        ref: 5.0.9
        submodules: recursive

    - name: Build and install Capstone 5.0.9
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update && sudo apt-get install -y cmake build-essential
        cd capstone
        ./make.sh
        sudo ./make.sh install

    - name: Install capstone (macOS)
      if: matrix.os == 'macos-15-intel'
      env:
        HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
      run: brew install capstone

    - uses: actions/checkout@v7

    - run: mv config.mk.template config.mk

    - name: Static link capstone (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: sed -i 's/-lcapstone/-L\/usr\/local\/lib -Wl,-Bstatic -lcapstone -Wl,-Bdynamic/' config.mk

    - name: Add capstone paths (macOS)
      if: matrix.os == 'macos-15-intel'
      run: |
        CAPSTONE_PREFIX="$(brew --prefix capstone)"
        test -f "${CAPSTONE_PREFIX}/lib/libcapstone.a"
        echo "CAPSTONE_CFLAGS += -I${CAPSTONE_PREFIX}/include" >> config.mk
        echo "CAPSTONE_LIBS = ${CAPSTONE_PREFIX}/lib/libcapstone.a" >> config.mk

    - name: Build macOS Intel x86_64
      if: matrix.os == 'macos-15-intel'
      run: make macos-x86

    - name: Verify macOS artifact is self-contained
      if: matrix.os == 'macos-15-intel'
      run: |
        if otool -L hactool | grep -qi capstone; then
          echo "hactool still has a dynamic Capstone dependency"
          otool -L hactool
          exit 1
        fi

    - name: Build Unix target
      if: matrix.os != 'macos-15-intel'
      run: make -j$(nproc 2>/dev/null || sysctl -n hw.logicalcpu)

    - uses: actions/upload-artifact@v7
      with:
        name: hactool-${{ matrix.job_name }}
        path: hactool*
